<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Path</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Memory Path</h1>
    </header>
    
    <main>
        <section id="Memoryform">
            <input type="text" id="title" placeholder="Memory title">
            <textarea id="description" cols="25" rows="15" placeholder="Describe the Memory"></textarea>
            <input type="date" id="date">
            <select id="mood">
                <option value="">choose mood</option>
                <option value="😀">Happy</option>
                <option value="😆">Laugh</option>
                <option value="🥺">Sad</option>
                <option value="😡">Angry</option>
                <option value="💖">Love</option>
                <option value="✅">Done</option>
                <option value="🥂">Party</option>
                <option value="🗿">Chad mode</option>
            </select>
            <button id="add">emotion click</button>
        </section>

        <section id="memorycontainer"></section>
    </main>


    <script src="script.js"></script>
</body>
</html>
